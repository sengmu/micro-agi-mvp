# 在线编译 AGI-Bot（系统桌宠）APK
# 触发：手动 Run workflow，或推送 android_host/** 变更
name: Build AGI-Bot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_host/**"
      - ".github/workflows/build-agi-bot.yml"
    branches: [main, master]
  pull_request:
    paths:
      - "android_host/**"
      - ".github/workflows/build-agi-bot.yml"

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agi-bot-debug
          path: android_host/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### AGI-Bot build" >> "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK not found"
          find app/build/outputs -name "*.apk" 2>/dev/null | while read f; do
            echo "- \`$f\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done
