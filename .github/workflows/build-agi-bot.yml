# 在线编译 AGI-Bot（系统桌宠）APK
name: Build AGI-Bot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_host/**"
      - ".github/workflows/build-agi-bot.yml"
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
    paths:
      - "android_host/**"
      - ".github/workflows/build-agi-bot.yml"

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          # accept licenses non-interactively
          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Gradle
        working-directory: android_host
        run: |
          chmod +x gradlew
          # 显式写入 SDK 路径，避免 "SDK location not found"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la
          java -version

      - name: Build debug APK
        working-directory: android_host
        run: |
          ./gradlew :app:assembleDebug --stacktrace --info --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: List outputs
        if: always()
        working-directory: android_host
        run: |
          find . -name "*.apk" -o -name "*.log" 2>/dev/null | head -50
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agi-bot-debug
          path: android_host/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
