# 在线编译 AGI-Bot（系统桌宠）APK
name: Build AGI-Bot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_host/**"
      - "app.py"
      - "db.py"
      - "ai_os.py"
      - "solana_watch.py"
      - "index.html"
      - "style.css"
      - "script.js"
      - "solana-wallet.js"
      - "pet.html"
      - "manifest.json"
      - "sw.js"
      - "nami_render.png"
      - "companion-room-night.png"
      - "pixi.min.js"
      - "pixi-unsafe-eval.min.js"
      - "pixi-unsafe-eval.LICENSE"
      - "live2dcubismcore.min.js"
      - "pixi-live2d-display.min.js"
      - "fonts/**"
      - "Hiyori/**"
      - "tests/**"
      - ".github/workflows/build-agi-bot.yml"
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
    paths:
      - "android_host/**"
      - "app.py"
      - "db.py"
      - "ai_os.py"
      - "solana_watch.py"
      - "index.html"
      - "style.css"
      - "script.js"
      - "solana-wallet.js"
      - "pet.html"
      - "manifest.json"
      - "sw.js"
      - "nami_render.png"
      - "companion-room-night.png"
      - "pixi.min.js"
      - "pixi-unsafe-eval.min.js"
      - "pixi-unsafe-eval.LICENSE"
      - "live2dcubismcore.min.js"
      - "pixi-live2d-display.min.js"
      - "fonts/**"
      - "Hiyori/**"
      - "tests/**"
      - ".github/workflows/build-agi-bot.yml"

jobs:
  build:
    name: Assemble Debug APK
    # Restore third-party assets from the functional APK, not standalone files.
    # Set this variable to the reviewed prototype APK release URL.
    if: ${{ vars.LIVE2D_ASSET_APK_URL != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore third-party assets from functional prototype
        env:
          ASSET_APK_URL: ${{ vars.LIVE2D_ASSET_APK_URL }}
        run: |
          curl --fail --location "$ASSET_APK_URL" --output /tmp/microagi-prototype.apk
          python3 tools/prepare_live2d_assets.py --apk /tmp/microagi-prototype.apk

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -q

      - name: Check bundled JavaScript syntax
        run: |
          node --check script.js
          node --check solana-wallet.js
          node --check sw.js
          node --check android_host/check-assetlinks.js

      - name: Test Android frontend initialization
        run: node --test tests/test_background_init.js tests/test_runtime_capabilities.js tests/test_voice_capabilities.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for embedded backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          # accept licenses non-interactively
          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Gradle
        working-directory: android_host
        run: |
          chmod +x gradlew
          # 显式写入 SDK 路径，避免 "SDK location not found"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la
          java -version

      - name: Check Android lint
        working-directory: android_host
        run: ./gradlew :app:lintDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build debug APK
        working-directory: android_host
        run: |
          ./gradlew :app:assembleDebug --stacktrace --info --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify packaged app resources and privacy
        run: python3 android_host/verify-apk-contents.py

      # Exercise the release-only CSP/lint/package path without producing or
      # uploading a signed distribution. Release signing remains a separate gate.
      - name: Build unsigned release APK
        working-directory: android_host
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify unsigned release resources and privacy
        run: python3 android_host/verify-apk-contents.py android_host/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: List outputs
        if: always()
        working-directory: android_host
        run: |
          find . -name "*.apk" -o -name "*.log" 2>/dev/null | head -50
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agi-bot-debug
          path: android_host/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
